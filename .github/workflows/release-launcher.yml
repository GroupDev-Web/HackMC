name: Build and release Midnight Launcher

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, for example v1.2.0"
        required: true
        default: "v1.2.0"

permissions:
  contents: write

concurrency:
  group: launcher-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  client:
    name: Build bundled Midnight Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
          cache-dependency-path: |
            Client/*.gradle
            Client/gradle.properties
            ScreenAPI/*.gradle
            ScreenAPI/gradle.properties

      - name: Build client jar
        working-directory: Client
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: midnight-client
          path: Client/build/libs/MidnightClient-1.5.0.jar
          if-no-files-found: error
          retention-days: 14

  launcher:
    name: ${{ matrix.label }}
    needs: client
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64 AppImage
            os: ubuntu-latest
            platform: linux
            arch: x64
            extension: AppImage
          - label: macOS Intel DMG
            os: macos-15-intel
            platform: mac
            arch: x64
            extension: dmg
          - label: macOS Apple Silicon DMG
            os: macos-15
            platform: mac
            arch: arm64
            extension: dmg
          - label: Windows x64 installer
            os: windows-latest
            platform: win
            arch: x64
            extension: exe
          - label: Windows x86 installer
            os: windows-latest
            platform: win
            arch: ia32
            extension: exe
          - label: Windows ARM64 installer
            os: windows-latest
            platform: win
            arch: arm64
            extension: exe

    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Launcher/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: midnight-client
          path: Client/build/libs

      - name: Install launcher dependencies
        working-directory: Launcher
        run: npm ci

      - name: Validate launcher
        working-directory: Launcher
        run: npm run check

      - name: Package launcher
        working-directory: Launcher
        shell: bash
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.platform }}-${{ matrix.arch }}
          path: Launcher/dist/*.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: launcher-*
          path: release-assets
          merge-multiple: true

      - name: Resolve release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "Midnight Launcher $RELEASE_TAG" \
              --generate-notes \
              --latest
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber

      - name: Publish workflow archive
        uses: actions/upload-artifact@v4
        with:
          name: midnight-launcher-${{ steps.release.outputs.tag }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30
